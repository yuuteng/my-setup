<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>我的设备</title>
<meta name="description" content="我的电脑配置和外设清单">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230a84ff'/%3E%3Crect x='14' y='17' width='36' height='24' rx='4' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M24 49h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f2f2f7;
  --bg-elev: rgba(255, 255, 255, .72);
  --bg-solid: #ffffff;
  --line: rgba(60, 60, 67, .12);
  --text: #1c1c1e;
  --text-2: rgba(60, 60, 67, .68);
  --text-3: rgba(60, 60, 67, .42);
  --fill: rgba(120, 120, 128, .12);
  --fill-2: rgba(120, 120, 128, .2);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px -12px rgba(0, 0, 0, .14);
  --shadow-up: 0 2px 4px rgba(0, 0, 0, .05), 0 28px 56px -18px rgba(0, 0, 0, .24);
  --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500;
  --purple: #af52de; --teal: #30b0c7; --pink: #ff2d55; --gray: #8e8e93;
  --orb-1: #7ab8ff; --orb-2: #ffb3d1; --orb-3: #b9f2d0; --orb-opacity: .55;
  --radius: 22px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC",
          "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --bg-elev: rgba(28, 28, 30, .7);
    --bg-solid: #1c1c1e;
    --line: rgba(235, 235, 245, .12);
    --text: #f5f5f7;
    --text-2: rgba(235, 235, 245, .64);
    --text-3: rgba(235, 235, 245, .36);
    --fill: rgba(120, 120, 128, .22);
    --fill-2: rgba(120, 120, 128, .34);
    --shadow: 0 0 0 .5px rgba(255, 255, 255, .06), 0 16px 40px -16px rgba(0, 0, 0, .8);
    --shadow-up: 0 0 0 .5px rgba(255, 255, 255, .1), 0 30px 60px -18px rgba(0, 0, 0, .9);
    --blue: #0a84ff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
    --purple: #bf5af2; --teal: #40c8e0; --pink: #ff375f; --gray: #98989d;
    --orb-1: #0a4bd6; --orb-2: #a3166b; --orb-3: #0d7a52; --orb-opacity: .5;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --bg-elev: rgba(28, 28, 30, .7);
  --bg-solid: #1c1c1e;
  --line: rgba(235, 235, 245, .12);
  --text: #f5f5f7;
  --text-2: rgba(235, 235, 245, .64);
  --text-3: rgba(235, 235, 245, .36);
  --fill: rgba(120, 120, 128, .22);
  --fill-2: rgba(120, 120, 128, .34);
  --shadow: 0 0 0 .5px rgba(255, 255, 255, .06), 0 16px 40px -16px rgba(0, 0, 0, .8);
  --shadow-up: 0 0 0 .5px rgba(255, 255, 255, .1), 0 30px 60px -18px rgba(0, 0, 0, .9);
  --blue: #0a84ff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
  --purple: #bf5af2; --teal: #40c8e0; --pink: #ff375f; --gray: #98989d;
  --orb-1: #0a4bd6; --orb-2: #a3166b; --orb-3: #0d7a52; --orb-opacity: .5;
}

* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background .5s var(--ease), color .3s;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 3px; border-radius: 10px; }

/* 背景光斑 */
.orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.orb {
  position: absolute; border-radius: 50%;
  filter: blur(90px); opacity: var(--orb-opacity);
  will-change: transform; transition: background 1s, opacity 1s;
}
.orb.a { width: 46vmax; height: 46vmax; background: var(--orb-1); top: -16vmax; left: -10vmax; animation: drift-a 26s ease-in-out infinite alternate; }
.orb.b { width: 40vmax; height: 40vmax; background: var(--orb-2); top: 8vmax; right: -14vmax; animation: drift-b 32s ease-in-out infinite alternate; }
.orb.c { width: 38vmax; height: 38vmax; background: var(--orb-3); bottom: -18vmax; left: 22vw; animation: drift-c 38s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate3d(14vw, 12vh, 0) scale(1.18); } }
@keyframes drift-b { to { transform: translate3d(-16vw, 18vh, 0) scale(.86); } }
@keyframes drift-c { to { transform: translate3d(-12vw, -16vh, 0) scale(1.22); } }

.wrap { width: min(1120px, 100%); margin: 0 auto; padding: 0 20px; }

/* 顶栏 */
.nav {
  position: sticky; top: 0; z-index: 20;
  padding: calc(10px + env(safe-area-inset-top)) 0 10px;
  transition: background .35s, box-shadow .35s, backdrop-filter .35s;
}
.nav.stuck {
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(22px);
  backdrop-filter: saturate(180%) blur(22px);
  box-shadow: 0 .5px 0 var(--line);
}
.nav-row { display: flex; align-items: center; gap: 12px; }
.nav-title {
  font-weight: 650; font-size: 17px; letter-spacing: -.01em;
  opacity: 0; transform: translateY(6px);
  transition: opacity .3s, transform .4s var(--ease);
}
.nav.stuck .nav-title { opacity: 1; transform: none; }
.nav-space { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--bg-elev);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: var(--shadow);
  transition: transform .35s var(--ease), background .3s;
}
.icon-btn:hover { transform: scale(1.08); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 19px; height: 19px; }
.pill-btn {
  height: 38px; padding: 0 16px; border-radius: 19px;
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 14.5px; font-weight: 600;
  background: var(--blue); color: #fff;
  box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--blue) 70%, transparent);
  transition: transform .35s var(--ease), filter .2s;
}
.pill-btn:hover { transform: translateY(-1px) scale(1.03); filter: brightness(1.08); }
.pill-btn:active { transform: scale(.95); }
.pill-btn svg { width: 16px; height: 16px; }

/* 大标题 */
.hero { padding: 38px 0 8px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--text-2);
  padding: 6px 12px 6px 10px; border-radius: 999px;
  background: var(--bg-elev);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: var(--shadow);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); position: relative; }
.dot::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--green); animation: ping 2.2s var(--ease) infinite;
}
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
h1 {
  margin-top: 18px;
  font-size: clamp(44px, 9vw, 84px);
  font-weight: 750; letter-spacing: -.035em; line-height: 1.04;
}
h1 .grad {
  background: linear-gradient(100deg, var(--blue), var(--purple) 45%, var(--pink) 80%, var(--orange));
  background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: sheen 9s ease-in-out infinite alternate;
}
@keyframes sheen { to { background-position: 100% 0; } }
.lede { margin-top: 14px; font-size: clamp(16px, 2.2vw, 20px); color: var(--text-2); max-width: 34em; }

/* 数字概览 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 30px; }
.stat {
  padding: 18px 18px 16px; border-radius: var(--radius);
  background: var(--bg-elev);
  -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
  box-shadow: var(--shadow);
}
.stat b { font-size: clamp(28px, 4.4vw, 42px); font-weight: 720; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--text-2); margin-left: 4px; }
.stat span { display: block; margin-top: 2px; font-size: 13px; color: var(--text-2); }

/* 工具条：分段控件 + 搜索 */
.tools { position: sticky; top: calc(58px + env(safe-area-inset-top)); z-index: 15; margin-top: 34px; padding: 6px 0; }
.tools-row { display: flex; gap: 10px; flex-wrap: wrap; }
.seg {
  position: relative; display: inline-flex; padding: 3px; border-radius: 13px;
  background: color-mix(in srgb, var(--fill) 100%, var(--bg-elev));
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: inset 0 0 0 .5px var(--line);
}
.seg-thumb {
  position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 10px;
  background: var(--bg-solid);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04);
  transition: transform .45s var(--ease), width .45s var(--ease);
}
.seg button {
  position: relative; z-index: 1; padding: 7px 16px; font-size: 14.5px; font-weight: 590;
  color: var(--text-2); border-radius: 10px; white-space: nowrap; transition: color .25s;
}
.seg button[aria-selected="true"] { color: var(--text); }
.search {
  flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 12px; border-radius: 13px;
  background: color-mix(in srgb, var(--fill) 100%, var(--bg-elev));
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: inset 0 0 0 .5px var(--line);
  transition: box-shadow .25s;
}
.search:focus-within { box-shadow: inset 0 0 0 2px var(--blue); }
.search svg { width: 17px; height: 17px; color: var(--text-3); flex: none; }
.search input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: none;
  font: inherit; font-size: 15.5px; color: var(--text);
}
.search input::placeholder { color: var(--text-3); }

/* 分组 */
.group { margin-top: 44px; }
.group-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.group h2 { font-size: clamp(26px, 4vw, 34px); font-weight: 720; letter-spacing: -.025em; }
.group-head p { font-size: 15px; color: var(--text-2); }
.count {
  margin-left: auto; font-size: 13px; font-weight: 600; color: var(--text-2);
  padding: 3px 10px; border-radius: 999px; background: var(--fill);
  font-variant-numeric: tabular-nums;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

/* 卡片 */
.card {
  --accent: var(--blue);
  position: relative; overflow: hidden;
  padding: 20px; border-radius: var(--radius);
  background: var(--bg-elev);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--shadow);
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0));
  transition: transform .5s var(--ease), box-shadow .5s var(--ease), opacity .6s var(--ease);
}
.card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%),
              color-mix(in srgb, var(--accent) 22%, transparent), transparent 62%);
  transition: opacity .4s;
}
.card:hover { --lift: -5px; box-shadow: var(--shadow-up); }
.card:hover::before { opacity: 1; }
.card.hide { display: none; }
.reveal { opacity: 0; transform: translateY(26px) scale(.975); }
.reveal.in { opacity: 1; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0)); }

.card-top { display: flex; align-items: center; gap: 12px; }
.ico {
  flex: none; width: 46px; height: 46px; border-radius: 13px;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 78%, #fff), var(--accent));
  box-shadow: 0 8px 18px -8px var(--accent), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .6s var(--ease);
}
.card:hover .ico { transform: scale(1.08) rotate(-5deg); }
.ico svg { width: 24px; height: 24px; }
.kind { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .01em; }
.model {
  display: block; width: 100%; text-align: left; margin-top: 14px; padding: 0;
  font-size: 20px; font-weight: 680; letter-spacing: -.018em; line-height: 1.25;
  border-radius: 8px; position: relative;
  transition: color .2s;
}
.model:hover { color: var(--accent); }
.card-top::after {
  content: "点击型号复制"; margin-left: auto;
  font-size: 11.5px; font-weight: 600; color: var(--text-3);
  opacity: 0; transform: translateX(6px); transition: opacity .25s, transform .35s var(--ease);
}
.card:has(.model:hover) .card-top::after, .card:has(.model:focus-visible) .card-top::after { opacity: 1; transform: none; }
.model.todo { color: var(--text-3); font-weight: 600; cursor: default; }

.specs { margin-top: 14px; border-radius: 13px; background: var(--fill); overflow: hidden; }
.specs div { display: flex; gap: 14px; padding: 9px 13px; font-size: 14.5px; }
.specs div + div { box-shadow: inset 0 .5px 0 var(--line); }
.specs dt { flex: none; color: var(--text-2); min-width: 4.2em; }
.specs dd { margin-left: auto; text-align: right; font-weight: 520; font-variant-numeric: tabular-nums; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tag {
  font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent);
}
.note {
  display: flex; gap: 8px; margin-top: 14px; font-size: 13.5px; color: var(--text-2); line-height: 1.45;
}
.note svg { flex: none; width: 15px; height: 15px; margin-top: 2px; color: var(--orange); }

.empty { display: none; padding: 60px 0; text-align: center; color: var(--text-2); }
.empty.show { display: block; }
.empty b { display: block; font-size: 20px; color: var(--text); margin-bottom: 4px; }

/* 待补充 */
.todo-box {
  margin-top: 16px; padding: 20px; border-radius: var(--radius);
  background: var(--bg-elev);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--shadow);
}
.todo-list { display: flex; flex-wrap: wrap; gap: 8px; }
.todo-chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 14px; font-weight: 550; padding: 7px 13px 7px 10px; border-radius: 999px;
  background: var(--fill); color: var(--text-2);
  box-shadow: inset 0 0 0 1px var(--line);
}
.todo-chip::before {
  content: ""; width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px dashed var(--text-3);
  animation: spin 14s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer { margin: 56px 0 calc(40px + env(safe-area-inset-bottom)); text-align: center; font-size: 13px; color: var(--text-3); }

/* 复制提示 */
.toast {
  position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); z-index: 50;
  display: flex; align-items: center; gap: 9px; max-width: calc(100vw - 40px);
  padding: 12px 18px 12px 14px; border-radius: 999px;
  font-size: 14.5px; font-weight: 600;
  color: #fff; background: rgba(40, 40, 44, .88);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .5), 0 0 0 .5px rgba(255, 255, 255, .14);
  transform: translate(-50%, 80px) scale(.9); opacity: 0;
  transition: transform .55s var(--ease), opacity .3s;
  pointer-events: none;
}
.toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
.toast svg { flex: none; width: 20px; height: 20px; color: var(--green); }
.toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.show path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s .12s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .hero { padding-top: 22px; }
  .grid { grid-template-columns: 1fr; }
  .seg { width: 100%; }
  .seg button { flex: 1; padding: 7px 6px; }
  .group-head p { display: none; }
  .pill-btn span { display: none; }
  .pill-btn { width: 38px; padding: 0; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  .reveal { opacity: 1; transform: none; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<div class="orbs" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<header class="nav" id="nav">
  <div class="wrap nav-row">
    <div class="nav-title">我的设备</div>
    <div class="nav-space"></div>
    <button class="pill-btn" id="copyAll" title="复制全部配置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.500 4H15"/></svg>
      <span>复制全部配置</span>
    </button>
    <button class="icon-btn" id="theme" title="切换深色 / 浅色" aria-label="切换深色或浅色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500Z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow reveal"><span class="dot"></span><span id="updated">最近更新</span></div>
    <h1 class="reveal">我的<span class="grad">设备</span></h1>
    <p class="lede reveal">电脑配置和外设都记在这里。点一下型号就能复制，不用每次再查。</p>
    <div class="stats" id="stats"></div>
  </section>

  <div class="tools">
    <div class="tools-row">
      <div class="seg" id="seg" role="tablist" aria-label="设备分类"><div class="seg-thumb" id="thumb"></div></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.600-3.600"/></svg>
        <input id="q" type="search" placeholder="搜索型号、规格" autocomplete="off" aria-label="搜索型号或规格">
      </label>
    </div>
  </div>

  <div id="groups"></div>
  <div class="empty" id="empty"><b>没有找到</b>换个关键词试试。</div>

  <section class="group" id="todoGroup">
    <div class="group-head"><h2>待补充</h2><p>这些还不知道</p><span class="count" id="todoCount"></span></div>
    <div class="todo-box reveal"><div class="todo-list" id="todo"></div></div>
  </section>

  <footer>硬件信息由系统读取，标了「待补充」的需要手动填。</footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>
  <span id="toastText"></span>
</div>

<script src="data.js"></script>
<script>
(() => {
  const D = window.SETUP;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const svg = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;

  const ICONS = {
    gpu: '<rect x="2.500" y="7" width="19" height="10" rx="2"/><circle cx="8.500" cy="12" r="2.300"/><circle cx="15.500" cy="12" r="2.300"/><path d="M6 17v2.500M10 17v2.500"/>',
    cpu: '<rect x="6" y="6" width="12" height="12" rx="2.500"/><rect x="9.500" y="9.500" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
    board: '<rect x="3.500" y="3.500" width="17" height="17" rx="2.500"/><rect x="7" y="7" width="5" height="5" rx="1"/><path d="M15.500 7v6M7 16h10M18 16.500v0"/>',
    ram: '<rect x="2.500" y="7.500" width="19" height="8" rx="1.500"/><path d="M6.500 10.500v2M10 10.500v2M14 10.500v2M17.500 10.500v2M5 15.500V18M9.500 15.500V18M14.500 15.500V18M19 15.500V18"/>',
    ssd: '<rect x="3" y="6" width="18" height="12" rx="2.500"/><path d="M7 10h6M7 14h3"/><circle cx="17" cy="14" r="1"/>',
    hdd: '<rect x="4" y="3.500" width="16" height="17" rx="2.500"/><circle cx="12" cy="10.500" r="4"/><circle cx="12" cy="10.500" r=".6"/><path d="M8 17.500h3"/>',
    net: '<path d="M2.500 9a14 14 0 0 1 19 0M5.500 12.500a9.500 9.500 0 0 1 13 0M8.500 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".9"/>',
    os: '<rect x="3.500" y="3.500" width="7.500" height="7.500" rx="1.200"/><rect x="13" y="3.500" width="7.500" height="7.500" rx="1.200"/><rect x="3.500" y="13" width="7.500" height="7.500" rx="1.200"/><rect x="13" y="13" width="7.500" height="7.500" rx="1.200"/>',
    monitor: '<rect x="2.500" y="4" width="19" height="12.500" rx="2"/><path d="M12 16.500V20M8 20h8"/>',
    tv: '<rect x="2" y="5" width="20" height="12" rx="1.800"/><path d="M7 20h10"/>',
    mouse: '<rect x="6.500" y="2.500" width="11" height="19" rx="5.500"/><path d="M12 6.500v3.500"/>',
    keyboard: '<rect x="2" y="6" width="20" height="12" rx="2.500"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9.500 14h5"/>',
    headphones: '<path d="M4 14.500V12a8 8 0 0 1 16 0v2.500"/><rect x="2.500" y="13.500" width="4.500" height="7" rx="2"/><rect x="17" y="13.500" width="4.500" height="7" rx="2"/>',
    earbuds: '<path d="M8.500 4a3.500 3.500 0 0 0-3.500 3.500c0 1.600 1 2.700 2.300 3.200V19a1.500 1.500 0 0 0 3 0V7.500A3.500 3.500 0 0 0 8.500 4Z"/><path d="M15.500 4A3.500 3.500 0 0 1 19 7.500c0 1.600-1 2.700-2.300 3.200V19a1.500 1.500 0 0 1-3 0V7.500A3.500 3.500 0 0 1 15.500 4Z"/>',
    gamepad: '<path d="M7.500 7h9a5 5 0 0 1 4.900 4l.9 4.500a2.600 2.600 0 0 1-4.600 2.100L16 16H8l-1.700 1.600a2.600 2.600 0 0 1-4.600-2.100L2.600 11a5 5 0 0 1 4.900-4Z"/><path d="M8 10.500v3M6.500 12h3M15.500 11h.01M17.500 13h.01"/>',
    cooler: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.600"/><path d="M12 10.400c-.6-2.600.4-4.600 2.600-5.400M13.400 12.800c2 1.800 4.200 1.900 6-.4M10.600 12.800c-2.500.8-3.800 2.600-3.400 4.900"/>',
    camera: '<circle cx="12" cy="9.500" r="6"/><circle cx="12" cy="9.500" r="2.300"/><path d="M12 15.500V19M8 20.500h8"/>',
  };
  const WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.500v5M12 16.200v.01"/></svg>';

  // 概览数字
  $("#updated").textContent = "最近更新 " + D.updated;
  $("#stats").innerHTML = D.stats.map((s) =>
    `<div class="stat reveal"><b data-to="${s.value}" data-dec="${s.decimals || 0}">0</b><i>${esc(s.unit)}</i><span>${esc(s.label)}</span></div>`
  ).join("");

  // 分段控件
  const seg = $("#seg"), thumb = $("#thumb");
  const tabs = [{ id: "all", title: "全部" }, ...D.groups.map((g) => ({ id: g.id, title: g.title }))];
  seg.insertAdjacentHTML("beforeend", tabs.map((t, i) =>
    `<button role="tab" data-id="${t.id}" aria-selected="${i === 0}">${esc(t.title)}</button>`).join(""));

  // 卡片
  const card = (it) => {
    const text = [it.name, it.model, ...(it.specs || []).flat(), ...(it.tags || []), it.note].filter(Boolean).join(" ").toLowerCase();
    return `<article class="card reveal" style="--accent:var(--${it.accent || "blue"})" data-text="${esc(text)}">
      <div class="card-top"><div class="ico">${svg(ICONS[it.icon] || ICONS.cpu)}</div><div class="kind">${esc(it.name)}</div></div>
      ${it.model
        ? `<button class="model" data-copy="${esc(it.model)}" title="点击复制型号">${esc(it.model)}</button>`
        : `<div class="model todo">待补充</div>`}
      ${it.specs && it.specs.length ? `<dl class="specs">${it.specs.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : ""}
      ${it.tags && it.tags.length ? `<div class="tags">${it.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      ${it.note ? `<p class="note">${WARN}<span>${esc(it.note)}</span></p>` : ""}
    </article>`;
  };
  $("#groups").innerHTML = D.groups.map((g) =>
    `<section class="group" data-group="${g.id}">
      <div class="group-head"><h2>${esc(g.title)}</h2><p>${esc(g.subtitle || "")}</p><span class="count"></span></div>
      <div class="grid">${g.items.map(card).join("")}</div>
    </section>`).join("");

  $("#todo").innerHTML = D.todo.map((t) => `<span class="todo-chip">${esc(t)}</span>`).join("");
  $("#todoCount").textContent = D.todo.length + " 项";
  if (!D.todo.length) $("#todoGroup").hidden = true;

  // 筛选
  let active = "all";
  const q = $("#q");
  const moveThumb = () => {
    const b = seg.querySelector('[aria-selected="true"]');
    thumb.style.width = b.offsetWidth + "px";
    thumb.style.transform = `translateX(${b.offsetLeft}px)`;
  };
  const apply = () => {
    const kw = q.value.trim().toLowerCase();
    let total = 0;
    document.querySelectorAll("[data-group]").forEach((sec) => {
      const inTab = active === "all" || sec.dataset.group === active;
      let n = 0;
      sec.querySelectorAll(".card").forEach((c) => {
        const ok = inTab && (!kw || c.dataset.text.includes(kw));
        c.classList.toggle("hide", !ok);
        if (ok) { n++; c.classList.add("in"); }
      });
      sec.hidden = n === 0;
      sec.querySelector(".count").textContent = n + " 件";
      total += n;
    });
    $("#empty").classList.toggle("show", total === 0);
    $("#todoGroup").hidden = !D.todo.length || active !== "all" || !!kw;
  };
  seg.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-selected", x === b));
    active = b.dataset.id; moveThumb(); apply();
  });
  q.addEventListener("input", apply);
  addEventListener("resize", moveThumb);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveThumb);
  moveThumb(); apply();

  // 复制
  const toast = $("#toast"); let tt;
  const say = (msg) => {
    $("#toastText").textContent = msg;
    toast.classList.remove("show"); void toast.offsetWidth; toast.classList.add("show");
    clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("show"), 2000);
  };
  const copy = async (text, msg) => {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch {}
      ta.remove();
    }
    say(msg);
  };
  document.addEventListener("click", (e) => {
    const m = e.target.closest("[data-copy]");
    if (m) copy(m.dataset.copy, "已复制：" + m.dataset.copy);
  });
  $("#copyAll").addEventListener("click", () => {
    const lines = [];
    D.groups.forEach((g) => {
      lines.push(`【${g.title}】`);
      g.items.forEach((it) => {
        const sp = (it.specs || []).map(([k, v]) => `${k} ${v}`).join("，");
        lines.push(`${it.name}：${it.model || "待补充"}${sp ? "（" + sp + "）" : ""}`);
      });
      lines.push("");
    });
    copy(lines.join("\n").trim(), "已复制全部配置");
  });

  // 主题切换
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch {}
  $("#theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  });

  // 顶栏
  const nav = $("#nav");
  const onScroll = () => nav.classList.toggle("stuck", scrollY > 90);
  addEventListener("scroll", onScroll, { passive: true }); onScroll();

  // 进场动画和数字滚动
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const countUp = (el) => {
    const to = +el.dataset.to, dec = +el.dataset.dec;
    if (reduce) { el.textContent = to.toFixed(dec); return; }
    const t0 = performance.now(), dur = 1300;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = (to * e).toFixed(dec);
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const io = new IntersectionObserver((entries) => {
    entries.filter((en) => en.isIntersecting).forEach((en, i) => {
      const el = en.target;
      el.style.transitionDelay = Math.min(i * 70, 420) + "ms";
      el.classList.add("in");
      el.querySelectorAll("[data-to]").forEach(countUp);
      setTimeout(() => (el.style.transitionDelay = ""), 1100);
      io.unobserve(el);
    });
  }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
  document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

  // 卡片跟随鼠标的高光和倾斜
  if (!reduce && matchMedia("(hover: hover)").matches) {
    document.querySelectorAll(".card").forEach((c) => {
      c.addEventListener("pointermove", (e) => {
        const r = c.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        c.style.setProperty("--mx", x * 100 + "%");
        c.style.setProperty("--my", y * 100 + "%");
        c.style.setProperty("--ry", (x - 0.5) * 6 + "deg");
        c.style.setProperty("--rx", (0.5 - y) * 6 + "deg");
      });
      c.addEventListener("pointerleave", () => { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); });
    });
  }
})();
</script>
</body>
</html>
