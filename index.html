<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>家里的东西</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23f5a524'/%3E%3Cpath d='M16 30 32 17l16 13v17H16Z' fill='none' stroke='%23111' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #efebe3;
  --card: rgba(250, 248, 243, .88);
  --solid: #fffdf8;
  --line: #e4ddd0;
  --text: #2a251d;
  --text-2: #5b5346;
  --text-3: #8d8576;
  --fill: rgba(96, 74, 30, .06);
  --fill-2: rgba(96, 74, 30, .1);
  --accent: #96590a;
  --accent-fill: #f2a93b;
  --on-accent: #3a2400;
  --warn: #c5441c;
  --glow-1: #f4dcae; --glow-2: #dfe5f1;
  --shadow: 0 0 0 1px #e4ddd0, 0 10px 30px -16px rgba(60, 44, 14, .18);
  --shadow-up: 0 0 0 1px #cfc6b5, 0 26px 50px -20px rgba(60, 44, 14, .3);
  --radius: 16px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220;
    --card: rgba(17, 26, 44, .86);
    --solid: #1d2a45;
    --line: #223050;
    --text: #e6ecf5;
    --text-2: #a7b4c8;
    --text-3: #66758f;
    --fill: rgba(148, 170, 214, .07);
    --fill-2: rgba(148, 170, 214, .13);
    --accent: #f5a524;
    --accent-fill: #f5a524;
    --on-accent: #111111;
    --warn: #ff6b3d;
    --glow-1: #13254d; --glow-2: #3a2812;
    --shadow: 0 0 0 1px #1f2b42, 0 14px 36px -18px rgba(0, 0, 0, .8);
    --shadow-up: 0 0 0 1px #2c3a57, 0 28px 56px -20px rgba(0, 0, 0, .9);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220;
  --card: rgba(17, 26, 44, .86);
  --solid: #1d2a45;
  --line: #223050;
  --text: #e6ecf5;
  --text-2: #a7b4c8;
  --text-3: #66758f;
  --fill: rgba(148, 170, 214, .07);
  --fill-2: rgba(148, 170, 214, .13);
  --accent: #f5a524;
  --accent-fill: #f5a524;
  --on-accent: #111111;
  --warn: #ff6b3d;
  --glow-1: #13254d; --glow-2: #3a2812;
  --shadow: 0 0 0 1px #1f2b42, 0 14px 36px -18px rgba(0, 0, 0, .8);
  --shadow-up: 0 0 0 1px #2c3a57, 0 28px 56px -20px rgba(0, 0, 0, .9);
}

* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  line-height: 1.5; -webkit-font-smoothing: antialiased;
  min-height: 100vh; overflow-x: hidden;
  transition: background .5s var(--ease), color .3s;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; border-radius: 10px; }

/* 背景：两团很淡的光，慢慢漂 */
.glow { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.glow i { position: absolute; border-radius: 50%; filter: blur(110px); will-change: transform; transition: background 1s; }
.glow .a { width: 52vmax; height: 52vmax; background: var(--glow-1); top: -22vmax; left: -12vmax; animation: drift-a 30s ease-in-out infinite alternate; }
.glow .b { width: 46vmax; height: 46vmax; background: var(--glow-2); bottom: -20vmax; right: -14vmax; animation: drift-b 38s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate3d(16vw, 14vh, 0) scale(1.15); } }
@keyframes drift-b { to { transform: translate3d(-14vw, -16vh, 0) scale(.9); } }

.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); width: min(1340px, 100%); margin: 0 auto; }
.wrap { min-width: 0; padding: 0 24px 0 12px; }

/* 左侧导航 */
.side {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
  padding: 22px 12px 18px 20px; display: flex; flex-direction: column; gap: 22px;
}
.tabs { --n: 3; --i: 0; position: relative; display: grid; gap: 2px; }
.tabs::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 42px; border-radius: 12px;
  background: var(--solid);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .1), 0 0 0 .5px rgba(0, 0, 0, .04);
  transform: translateY(calc(var(--i) * 44px));
  transition: transform .45s var(--ease);
}
.tabs button {
  position: relative; z-index: 1; height: 42px; display: flex; align-items: center; gap: 10px;
  padding: 0 12px; border-radius: 12px; font-size: 15px; font-weight: 590; color: var(--text-2);
  transition: color .25s;
}
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button[aria-selected="true"] svg { color: var(--accent); }
.tabs svg { width: 19px; height: 19px; flex: none; }
.toc { display: grid; gap: 1px; }
.toc-title { padding: 0 12px 6px; font-size: 12px; font-weight: 700; color: var(--text-3); letter-spacing: .04em; }
.toc button {
  display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; border-radius: 9px;
  font-size: 14px; color: var(--text-2); text-align: left; transition: background .2s, color .2s;
}
.toc button:hover { background: var(--fill); color: var(--text); }
.toc button span { color: var(--text-3); font-family: var(--mono); font-size: 12px; }
.side .icon-btn { margin-top: auto; }

.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--fill-2); transition: transform .35s var(--ease), background .2s;
}
.icon-btn:hover { transform: scale(1.08); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 18px; height: 18px; }

/* 页面切换 */
.page { display: none; padding: 26px 0 60px; }
.head, .card { scroll-margin-top: 20px; }
.page.on { display: block; animation: page-in .55s var(--ease); }
@keyframes page-in { from { opacity: 0; transform: translateY(14px); } }

.head { display: flex; align-items: center; gap: 12px; margin: 30px 0 14px; }
.page > .head:first-child { margin-top: 0; }
h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.count { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--accent); padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
.text-btn {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600; color: var(--accent);
  padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 11%, transparent);
  transition: transform .3s var(--ease), background .2s;
}
.text-btn:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.text-btn:active { transform: scale(.95); }
.text-btn svg { width: 15px; height: 15px; }

.panel {
  border-radius: var(--radius); background: var(--card);
  -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%);
  box-shadow: var(--shadow);
}

/* 汇总表 */
.table-box { overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th {
  text-align: left; font-size: 12.5px; font-weight: 600; color: var(--text-2);
  padding: 12px 16px; white-space: nowrap; box-shadow: inset 0 -.5px 0 var(--line);
}
td { padding: 11px 16px; vertical-align: top; }
tbody tr { transition: background .2s, opacity .6s var(--ease), transform .6s var(--ease); }
tbody tr + tr td { box-shadow: inset 0 .5px 0 var(--line); }
tbody tr:hover { background: var(--fill); }
tr.sep td {
  padding: 16px 16px 6px; font-size: 12.5px; font-weight: 700; color: var(--text-3);
  letter-spacing: .04em; box-shadow: none; background: none;
}
tr.sep td { color: var(--accent); }
tr.sep:hover { background: none; }
tr.sep + tr td { box-shadow: none; }
.c-name { color: var(--text-2); white-space: nowrap; width: 1%; }
.c-name svg { width: 17px; height: 17px; margin-right: 8px; vertical-align: -3.5px; color: var(--accent); }
.c-model { font-weight: 620; }
.c-spec { color: var(--text-2); }
.c-go { width: 1%; color: var(--text-3); }
.c-go svg { display: block; width: 16px; height: 16px; opacity: 0; transform: translateX(-6px); transition: opacity .25s, transform .35s var(--ease); }
tr[data-jump] { cursor: pointer; }
tr[data-jump]:hover .c-go svg { opacity: 1; transform: none; }
.jump { text-align: left; font-weight: inherit; border-radius: 6px; }
.copy { text-align: left; font-weight: inherit; border-radius: 6px; transition: color .2s; }
.copy:hover { color: var(--accent); }
.copy:active { opacity: .6; }

/* 工具条 */
.tools { display: flex; margin: 34px 0 4px; }
.search {
  flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 12px; border-radius: 12px; background: var(--fill-2);
  transition: box-shadow .25s;
}
.search:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.search svg { width: 16px; height: 16px; color: var(--text-3); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 15px; color: var(--text); }
.search input::placeholder { color: var(--text-3); }

/* 卡片 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.card {
  position: relative; overflow: hidden; padding: 18px; border-radius: var(--radius);
  background: var(--card);
  -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%);
  box-shadow: var(--shadow);
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0));
  transition: transform .5s var(--ease), box-shadow .5s var(--ease), opacity .6s var(--ease);
}
.card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--accent) 13%, transparent), transparent 65%);
  transition: opacity .4s;
}
.card:hover { --lift: -4px; box-shadow: var(--shadow-up); }
.card:hover::before { opacity: 1; }
.card.hide { display: none; }
.reveal { opacity: 0; transform: translateY(22px) scale(.98); }
.reveal.in { opacity: 1; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0)); }
.panel.reveal { transition: opacity .6s var(--ease), transform .6s var(--ease); }
.panel.reveal.in, tr.reveal.in { transform: none; }

.card-top { display: flex; align-items: center; gap: 10px; }
.ico {
  flex: none; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--fill-2); color: var(--text);
  transition: transform .6s var(--ease), background .3s, color .3s;
}
.card:hover .ico { transform: scale(1.08) rotate(-5deg); background: var(--accent-fill); color: var(--on-accent); }
.ico svg { width: 21px; height: 21px; }
.kind { font-size: 13.5px; font-weight: 600; color: var(--accent); }
.model { display: block; width: 100%; margin-top: 12px; font-size: 18.5px; font-weight: 680; letter-spacing: -.015em; line-height: 1.28; }

.specs { margin-top: 12px; border-radius: 12px; background: var(--fill); overflow: hidden; }
.specs div { display: flex; gap: 14px; padding: 8px 12px; font-size: 14px; }
.specs div + div { box-shadow: inset 0 .5px 0 var(--line); }
.specs dt { flex: none; color: var(--text-2); max-width: 46%; }
.specs dd { margin-left: auto; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.more summary {
  display: flex; align-items: center; gap: 6px; margin-top: 10px; padding: 7px 10px; border-radius: 10px;
  font-size: 13.5px; font-weight: 600; color: var(--accent); cursor: pointer; list-style: none; user-select: none;
  transition: background .2s;
}
.more summary::-webkit-details-marker { display: none; }
.more summary:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.more summary svg { width: 14px; height: 14px; transition: transform .35s var(--ease); }
.more summary i { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text-3); }
.more .opened, .more[open] .closed { display: none; }
.more[open] .opened { display: inline; }
.more[open] summary svg { transform: rotate(90deg); }
.more .specs { margin-top: 6px; }
.more[open] .specs { animation: unfold .45s var(--ease); }
@keyframes unfold { from { opacity: 0; transform: translateY(-8px); } }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.links a {
  position: relative; display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
  font-size: 13.5px; font-weight: 600; color: var(--accent);
  padding: 5px 11px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 11%, transparent);
  transition: background .2s, transform .3s var(--ease);
}
.links a:hover { background: color-mix(in srgb, var(--accent) 19%, transparent); transform: translateY(-1px); }
.links svg { width: 13px; height: 13px; }
.card.flash { animation: flash 1.8s var(--ease); }
@keyframes flash {
  0%, 55% { box-shadow: 0 0 0 2.5px var(--accent), var(--shadow-up); }
  100% { box-shadow: 0 0 0 2.5px transparent, var(--shadow); }
}
.note { display: flex; gap: 8px; margin-top: 12px; font-size: 13.5px; color: var(--warn); line-height: 1.45; }
.note svg { flex: none; width: 15px; height: 15px; margin-top: 2px; }

.todo { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; }
.todo span {
  font-size: 14px; font-weight: 550; color: var(--text-2);
  padding: 6px 13px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line);
}

.empty { padding: 90px 20px; text-align: center; color: var(--text-2); }
.empty svg { width: 46px; height: 46px; color: var(--text-3); animation: bob 3.2s ease-in-out infinite; }
.empty b { display: block; margin-top: 12px; font-size: 19px; color: var(--text); }
@keyframes bob { 50% { transform: translateY(-7px); } }
.none { display: none; padding: 50px 0; text-align: center; color: var(--text-2); }
.none.show { display: block; }

footer { padding: 0 0 calc(34px + env(safe-area-inset-bottom)); text-align: center; font-size: 12.5px; color: var(--text-3); font-family: var(--mono); }

/* 复制提示 */
.toast {
  position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 50;
  display: flex; align-items: center; gap: 9px; max-width: calc(100vw - 40px);
  padding: 11px 18px 11px 14px; border-radius: 999px; font-size: 14.5px; font-weight: 600;
  color: #fff; background: rgba(44, 44, 46, .92);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .5), 0 0 0 .5px rgba(255, 255, 255, .14);
  transform: translate(-50%, 80px) scale(.9); opacity: 0; pointer-events: none;
  transition: transform .55s var(--ease), opacity .3s;
}
.toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
.toast svg { flex: none; width: 19px; height: 19px; color: #3ecf8e; }
.toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.show path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s .12s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

@media (max-width: 860px) {
  .shell { display: block; }
  .wrap { padding: 0 16px; }
  .side {
    z-index: 20; height: auto; flex-direction: row; align-items: center; gap: 12px; overflow: visible;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: color-mix(in srgb, var(--bg) 76%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
    box-shadow: 0 .5px 0 var(--line);
  }
  .tabs { flex: 1; gap: 0; grid-template-columns: repeat(var(--n), 1fr); padding: 3px; border-radius: 12px; background: var(--fill-2); }
  .tabs::before { left: 3px; right: auto; top: 3px; height: 34px; width: calc((100% - 6px) / var(--n)); border-radius: 9px; transform: translateX(calc(var(--i) * 100%)); }
  .tabs button { height: 34px; justify-content: center; gap: 6px; padding: 0 4px; font-size: 14.5px; }
  .tabs svg { width: 16px; height: 16px; }
  .toc { display: none; }
  .side .icon-btn { margin: 0; }
  .head, .card { scroll-margin-top: 76px; }
}
@media (max-width: 720px) {
  .grid { grid-template-columns: 1fr; }
  /* 汇总表在手机上改成一行一块 */
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tbody tr { padding: 11px 16px; }
  tbody tr + tr { box-shadow: inset 0 .5px 0 var(--line); }
  tbody tr + tr td, td { box-shadow: none; padding: 0; }
  tr.sep { padding: 14px 16px 2px; box-shadow: none; }
  tr.sep td { padding: 0; }
  .c-name { width: auto; font-size: 12.5px; }
  .c-spec { font-size: 13.5px; }
  .c-go { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  .reveal { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<div class="glow" aria-hidden="true"><i class="a"></i><i class="b"></i></div>

<div class="shell">
  <aside class="side">
    <nav class="tabs" id="pageTabs" role="tablist" aria-label="类别"></nav>
    <div class="toc" id="toc"></div>
    <button class="icon-btn" id="theme" title="切换深色 / 浅色" aria-label="切换深色或浅色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </aside>
  <div>
    <main class="wrap" id="pages"></main>
    <footer id="foot"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
  <span id="toastText"></span>
</div>

    ram: '<rect x="2.5" y="7.5" width="19" height="8" rx="1.5"/><path d="M6.5 10.5v2M10 10.5v2M14 10.5v2M17.5 10.5v2M5 15.5V18M9.5 15.5V18M14.5 15.5V18M19 15.5V18"/>',
    cooler: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.6"/><path d="M12 10.4c-.6-2.6.4-4.6 2.6-5.4M13.4 12.8c2 1.8 4.2 1.9 6-.4M10.6 12.8c-2.5.8-3.8 2.6-3.4 4.9"/>',
    case: '<rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M9.5 6h5M9.5 9h5"/><circle cx="12" cy="16" r="1.4"/>',
    ssd: '<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h6M7 14h3"/><circle cx="17" cy="14" r="1"/>',
    hdd: '<rect x="4" y="3.5" width="16" height="17" rx="2.5"/><circle cx="12" cy="10.5" r="4"/><path d="M8 17.5h3"/>',
    net: '<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".9"/>',
    router: '<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01M8 13V7M16 13V7M10 5.5a3 3 0 0 1 4 0"/>',
    os: '<rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.2"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.2"/>',
    monitor: '<rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M12 16.5V20M8 20h8"/>',
    tv: '<rect x="2" y="5" width="20" height="12" rx="1.8"/><path d="M7 20h10"/>',
    mouse: '<rect x="6.5" y="2.5" width="11" height="19" rx="5.5"/><path d="M12 6.5v3.5"/>',
    keyboard: '<rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9.5 14h5"/>',
    headphones: '<path d="M4 14.5V12a8 8 0 0 1 16 0v2.5"/><rect x="2.5" y="13.5" width="4.5" height="7" rx="2"/><rect x="17" y="13.5" width="4.5" height="7" rx="2"/>',
    gamepad: '<path d="M7.5 7h9a5 5 0 0 1 4.9 4l.9 4.5a2.6 2.6 0 0 1-4.6 2.1L16 16H8l-1.7 1.6a2.6 2.6 0 0 1-4.6-2.1L2.6 11a5 5 0 0 1 4.9-4Z"/><path d="M8 10.5v3M6.5 12h3M15.5 11h.01M17.5 13h.01"/>',
    camera: '<circle cx="12" cy="9.5" r="6"/><circle cx="12" cy="9.5" r="2.3"/><path d="M12 15.5V19M8 20.5h8"/>',
    psu: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9.5" cy="12" r="3.5"/><path d="M16.5 9.5h1.500M16.5 14.5h1.500"/>',
    speaker: '<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><circle cx="12" cy="14.5" r="3.5"/><circle cx="12" cy="7" r="1.200"/>',
    fridge: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 10h12M9.500 5.500v2M9.500 13v3"/>',
    sofa: '<path d="M5 11V8.500A2.500 2.500 0 0 1 7.500 6h9A2.500 2.500 0 0 1 19 8.500V11"/><path d="M3 12.500a2 2 0 0 1 4 0V14h10v-1.500a2 2 0 0 1 4 0V17a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1ZM6 18v1.500M18 18v1.500"/>',
    bed: '<path d="M3 18v-6.500A2.500 2.500 0 0 1 5.500 9h13a2.500 2.500 0 0 1 2.500 2.500V18M3 15.500h18M3 18v1.500M21 18v1.500M6 9V6.500A1.500 1.500 0 0 1 7.500 5h9A1.500 1.500 0 0 1 18 6.500V9"/>',
    table: '<path d="M3 8h18M5 8v11M19 8v11M5 12.500h14"/>',
    washer: '<rect x="4.500" y="2.500" width="15" height="19" rx="2.500"/><circle cx="12" cy="13.500" r="4"/><path d="M8 6h.01M11 6h2"/>',
    oven: '<rect x="3.500" y="3.500" width="17" height="17" rx="2.500"/><rect x="7" y="10" width="10" height="7" rx="1.200"/><path d="M7.500 6.800h.01M11 6.800h.01"/>',
    hob: '<rect x="3" y="5" width="18" height="14" rx="2.500"/><circle cx="8.500" cy="12" r="2.500"/><circle cx="15.500" cy="12" r="2.500"/>',
    hood: '<path d="M9 3h6v6l4 6v3H5v-3l4-6ZM5 15h14"/>',
    box: '<path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16Z"/><path d="M3.5 8 12 12.5 20.5 8M12 12.5v8"/>',
  };
  const WARN = svg('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.01"/>');
  const COPY = svg('<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/>');
  const LINK = svg('<path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4"/>');
  const CHEV = svg('<path d="m9 6 6 6-6 6"/>');
  const buyText = (b) => (b ? [b.date, b.delivered && b.delivered + " 送货", b.channel, b.price].filter(Boolean).join(" · ") : "");
  const allItems = (p) => p.groups.flatMap((g) => g.items);

  // 一个物品的卡片
  const card = (it, id) => {
    const specs = [...(it.specs || [])];
    if (it.buy) {
      if (it.buy.date) specs.push(["购买日期", it.buy.date]);
      if (it.buy.delivered) specs.push(["送货日期", it.buy.delivered]);
      if (it.buy.channel) specs.push(["购买渠道", it.buy.channel]);
      if (it.buy.price) specs.push(["价格", it.buy.price]);
    }
    const more = it.more || [];
    const row = ([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`;
    const text = [it.name, it.model, it.summary, ...specs.flat(), ...more.flat(), it.note].filter(Boolean).join(" ").toLowerCase();
    return `<article class="card reveal" id="${id}" data-text="${esc(text)}">
      <div class="card-top"><div class="ico">${svg(ICONS[it.icon] || ICONS.box)}</div><div class="kind">${esc(it.name)}</div></div>
      ${it.model ? `<button class="model copy" data-copy="${esc(it.model)}" title="点击复制">${esc(it.model)}</button>` : ""}
      ${specs.length ? `<dl class="specs">${specs.map(row).join("")}</dl>` : ""}
      ${more.length ? `<details class="more"><summary>${CHEV}<span class="closed">全部参数</span><span class="opened">收起</span><i>${more.length} 项</i></summary>
        <dl class="specs">${more.map(row).join("")}</dl></details>` : ""}
      ${it.links && it.links.length ? `<div class="links">${it.links.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}${LINK}</a>`).join("")}</div>` : ""}
      ${it.note ? `<p class="note">${WARN}<span>${esc(it.note)}</span></p>` : ""}
    </article>`;
  };

  // 一个页面
  const page = (p) => {
    const items = allItems(p);
    if (!items.length) {
      return `<section class="page" data-page="${p.id}"><div class="empty">${svg(ICONS.box)}<b>${esc(p.title)}还没有记录</b></div></section>`;
    }
    const multi = p.groups.length > 1;
    const cid = (g, i) => `i-${p.id}-${g.id}-${i}`;
    const rows = p.groups.map((g) =>
      (multi ? `<tr class="sep"><td colspan="4">${esc(g.title)}</td></tr>` : "") +
      g.items.map((it, i) => `<tr class="reveal" data-jump="${cid(g, i)}">
        <td class="c-name">${svg(ICONS[it.icon] || ICONS.box)}${esc(it.name)}</td>
        <td class="c-model"><button class="jump" title="查看详情">${esc(it.model || "")}</button></td>
        <td class="c-spec">${esc(it.summary || "")}</td>
        <td class="c-go">${CHEV}</td>
      </tr>`).join("")).join("");
    return `<section class="page" data-page="${p.id}">
      <div class="head" id="sum-${p.id}"><h2>汇总</h2><span class="count">${items.length} 件</span>
        <button class="text-btn" data-copy-all="${p.id}">${COPY}复制全部</button></div>
      <div class="panel table-box reveal"><table>
        <thead><tr><th>名称</th><th>型号</th><th>规格</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>

      <div class="tools">
        <label class="search">${svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>')}
          <input type="search" placeholder="搜索" autocomplete="off" aria-label="搜索"></label>
      </div>
      ${p.groups.map((g) => `<div class="group" data-group="${g.id}">
        <div class="head" id="g-${p.id}-${g.id}"><h2>${esc(g.title)}</h2><span class="count"></span></div>
        <div class="grid">${g.items.map((it, i) => card(it, cid(g, i))).join("")}</div></div>`).join("")}
      <div class="none">没有找到</div>
      ${p.todo && p.todo.length ? `<div class="todo-wrap"><div class="head"><h2>待补充</h2><span class="count">${p.todo.length} 项</span></div>
        <div class="panel todo reveal">${p.todo.map((t) => `<span>${esc(t)}</span>`).join("")}</div></div>` : ""}
    </section>`;
  };

  const tabs = $("#pageTabs");
  tabs.style.setProperty("--n", D.pages.length);
  tabs.innerHTML = D.pages.map((p) => `<button role="tab" data-page="${p.id}" aria-selected="false">${svg(ICONS[p.icon] || ICONS.box)}${esc(p.title)}</button>`).join("");
  $("#pages").innerHTML = D.pages.map(page).join("");
  $("#foot").textContent = "更新于 " + D.updated;

  // 进场动画
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const io = new IntersectionObserver((entries) => {
    entries.filter((en) => en.isIntersecting).forEach((en, i) => {
      const el = en.target;
      el.style.transitionDelay = Math.min(i * 45, 400) + "ms";
      el.classList.add("in");
      setTimeout(() => (el.style.transitionDelay = ""), 1000);
      io.unobserve(el);
    });
  }, { threshold: 0.05, rootMargin: "0px 0px -30px 0px" });

  // 切换页面（地址里的 #pc、#appliances 等）
  const show = (id) => {
    const idx = Math.max(0, D.pages.findIndex((p) => p.id === id));
    const p = D.pages[idx];
    tabs.style.setProperty("--i", idx);
    $$("button", tabs).forEach((b, i) => b.setAttribute("aria-selected", i === idx));
    $$(".page").forEach((s) => s.classList.toggle("on", s.dataset.page === p.id));
    document.title = p.title + " · 家里的东西";
    $("#toc").innerHTML = allItems(p).length
      ? `<div class="toc-title">${esc(p.title)}</div><button data-to="sum-${p.id}">汇总</button>` +
        p.groups.map((g) => `<button data-to="g-${p.id}-${g.id}">${esc(g.title)}<span>${g.items.length}</span></button>`).join("")
      : "";
    $$(`.page.on .reveal:not(.in)`).forEach((el) => io.observe(el));
    scrollTo({ top: 0 });
  };
  tabs.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    history.replaceState(null, "", "#" + b.dataset.page); show(b.dataset.page);
  });
  addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));

  // 页内搜索
  $$(".page").forEach((sec) => {
    const q = $(".search input", sec);
    if (!q) return;
    const apply = () => {
      const kw = q.value.trim().toLowerCase();
      let total = 0;
      $$(".group", sec).forEach((g) => {
        let n = 0;
        $$(".card", g).forEach((c) => {
          const ok = !kw || c.dataset.text.includes(kw);
          c.classList.toggle("hide", !ok);
          if (ok) n++;
        });
        g.hidden = n === 0;
        $(".count", g).textContent = n + " 件";
        total += n;
      });
      $(".none", sec).classList.toggle("show", total === 0);
      const todo = $(".todo-wrap", sec);
      if (todo) todo.hidden = !!kw;
      $$(".card.reveal:not(.in):not(.hide)", sec).forEach((el) => io.observe(el));
    };
    q.addEventListener("input", apply);
    sec._clearSearch = () => { if (q.value) { q.value = ""; apply(); } };
    apply();
  });

  // 跳到详情卡片或分组
  const smooth = reduce ? "auto" : "smooth";
  const jumpTo = (id) => {
    const el = document.getElementById(id); if (!el) return;
    const sec = el.closest(".page");
    if (sec && sec._clearSearch) sec._clearSearch();
    const isCard = el.classList.contains("card");
    el.scrollIntoView({ behavior: smooth, block: isCard ? "center" : "start" });
    if (isCard) {
      el.classList.add("in");
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    }
  };
  document.addEventListener("click", (e) => {
    const row = e.target.closest("[data-jump]");
    if (row) return jumpTo(row.dataset.jump);
    const to = e.target.closest("[data-to]");
    if (to) jumpTo(to.dataset.to);
  });

  // 复制
  const toast = $("#toast"); let tt;
  const say = (msg) => {
    $("#toastText").textContent = msg;
    toast.classList.remove("show"); void toast.offsetWidth; toast.classList.add("show");
    clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("show"), 2000);
  };
  const copy = async (text, msg) => {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch {}
      ta.remove();
    }
    say(msg);
  };
  document.addEventListener("click", (e) => {
    const one = e.target.closest("[data-copy]");
    if (one) return copy(one.dataset.copy, "已复制：" + one.dataset.copy);
    const all = e.target.closest("[data-copy-all]");
    if (!all) return;
    const p = D.pages.find((x) => x.id === all.dataset.copyAll);
    const lines = [];
    p.groups.forEach((g) => {
      lines.push(`【${g.title}】`);
      g.items.forEach((it) => {
        const extra = [it.summary, buyText(it.buy)].filter(Boolean).join("；");
        lines.push(`${it.name}：${it.model || ""}${extra ? "（" + extra + "）" : ""}`);
      });
      lines.push("");
    });
    copy(lines.join("\n").trim(), "已复制全部");
  });

  // 主题
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch {}
  $("#theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  });

  // 卡片跟随鼠标倾斜
  if (!reduce && matchMedia("(hover: hover)").matches) {
    $$(".card").forEach((c) => {
      c.addEventListener("pointermove", (e) => {
        const r = c.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        c.style.setProperty("--mx", x * 100 + "%");
        c.style.setProperty("--my", y * 100 + "%");
        c.style.setProperty("--ry", (x - 0.5) * 5 + "deg");
        c.style.setProperty("--rx", (0.5 - y) * 5 + "deg");
      });
      c.addEventListener("pointerleave", () => { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); });
    });
  }
})();
</script>
</body>
</html>
